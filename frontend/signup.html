
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | PreprocessAI</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<header>
    <h2>PreprocessAI</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="login-container">

    <section class="brand-section">
        <p class="tag">AI-POWERED DATA PREPARATION</p>

        <h1>Start Your Data Journey with PreprocessAI</h1>

        <p>
            Create your account to analyze datasets,
            compare preprocessing pipelines and explore
            explainable AI recommendations.
        </p>
    </section>

    <section class="login-section">
        <div class="login-card">

            <h2>Create Account</h2>
            <p>Sign up to get started.</p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name"
                        placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        placeholder="Create a password"
                        minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                        placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="login-button">
                    Create Account
                </button>

                <p id="signupMessage"></p>

            </form>

            <p class="signup-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </section>

</main>

<script src="signup.js"></script>

</body>
</html>
