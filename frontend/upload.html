<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Dataset | PreprocessAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>PreprocessAI</h2>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="upload-container">
        <h1>Upload Your Dataset</h1>
        <p>Upload a CSV file to get a recommended preprocessing pipeline.</p>

        <div class="upload-box">
            <input type="file" id="datasetFile" accept=".csv">

            <p id="fileName">No file selected</p>

            <div class="form-row">
                <label for="targetColumn">Target column (what you want to predict)</label>
                <select id="targetColumn" disabled>
                    <option value="">Choose a CSV file first</option>
                </select>
            </div>

            <div class="form-row">
                <label for="task">Task</label>
                <select id="task">
                    <option value="">Select a task</option>
                    <option value="classification">Classification (predict a category)</option>
                    <option value="regression">Regression (predict a number)</option>
                </select>
            </div>

            <button id="analyzeButton">Analyze Dataset</button>

            <p id="statusMessage" role="status"></p>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="upload.js"></script>
</body>
</html>
