
name: Docker

# Builds the Docker image, starts it, and runs real recommendations
# through it, so the image is tested without needing Docker on a laptop.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t preprocessai .

      - name: Start container for Iris
        run: docker run -d --name app -p 7860:7860 preprocessai

      - name: Wait for Iris API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The API did not become healthy."
          exit 1

      - name: Check website pages
        run: |
          set -e
          curl -fsS http://127.0.0.1:7860/ | grep -qi "<html"
          curl -fsS http://127.0.0.1:7860/upload.html | grep -qi "<html"
          echo "Website pages loaded successfully."

      - name: Recommend, explain, export and clean (iris.csv)
        run: |
          set -e
          curl -fsS --max-time 300 \
            -F "file=@experiments/data/iris.csv" \
            -F "target=species" -F "task=classification" \
            http://127.0.0.1:7860/recommend -o rec.json

          ID=$(python3 -c "import json; print(json.load(open('rec.json'))['recommendation_id'])")
          echo "Iris recommendation_id: $ID"

          curl -fsS --max-time 120 -X POST -H "Content-Type: application/json" \
            -d "{\"recommendation_id\": \"$ID\"}" \
            http://127.0.0.1:7860/explain -o /dev/null

          curl -fsS --max-time 120 \
            http://127.0.0.1:7860/export/$ID -o /dev/null

          curl -fsS --max-time 300 \
            -F "recommendation_id=$ID" \
            -F "file=@experiments/data/iris.csv" \
            http://127.0.0.1:7860/clean -o /dev/null

          echo "All Iris endpoints worked inside the container."
          echo "Iris container peak memory (bytes):"
          docker exec app cat /sys/fs/cgroup/memory.peak

      - name: Stop Iris container
        run: |
          docker stop app
          docker rm app

      - name: Start fresh container for Adult
        run: docker run -d --name app -p 7860:7860 preprocessai

      - name: Wait for Adult API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health; then
              exit 0
            fi
            sleep 2
          done
          echo "The Adult API did not become healthy."
          exit 1

      - name: Recommend, explain, export and clean (adult.csv)
        run: |
          set -e
          curl -fsS --max-time 300 \
            -F "file=@experiments/data/adult.csv" \
            -F "target=income" -F "task=classification" \
            http://127.0.0.1:7860/recommend -o adult-rec.json

          ID=$(python3 -c "import json; print(json.load(open('adult-rec.json'))['recommendation_id'])")
          echo "Adult recommendation_id: $ID"

          curl -fsS --max-time 120 -X POST -H "Content-Type: application/json" \
            -d "{\"recommendation_id\": \"$ID\"}" \
            http://127.0.0.1:7860/explain -o /dev/null

          curl -fsS --max-time 120 \
            http://127.0.0.1:7860/export/$ID -o /dev/null

          curl -fsS --max-time 300 \
            -F "recommendation_id=$ID" \
            -F "file=@experiments/data/adult.csv" \
            http://127.0.0.1:7860/clean -o /dev/null

          echo "All Adult endpoints worked inside the container."

      - name: Show Adult container peak memory
        run: |
          echo "Adult container peak memory (bytes):"
          docker exec app cat /sys/fs/cgroup/memory.peak

      - name: Show container logs on failure
        if: failure()
        run: docker logs app
